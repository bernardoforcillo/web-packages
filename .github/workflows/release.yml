name: Release

on:
  push:
    branches: [main]
    paths:
      - ".changeset/**"
      - "packages/**/package.json"
      - "packages/**/changelog.md"
      - "crates/**/package.json"
      - "crates/**/Cargo.toml"
      - "crates/**/Cargo.lock"
      - "crates/**/changelog.md"
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      # Opens or updates the "Version Packages" PR. When that PR is merged, the
      # same step publishes to npm and crates.io, then creates GitHub releases.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
