[package]
name = "vite-serve"
version = "0.1.0"
edition = "2024"
description = "Static file server that injects per-route SEO head tags into a Vite SPA index.html"
license = "MIT"
repository = "https://github.com/bernardoforcillo/web-packages"
readme = "readme.md"
keywords = ["vite", "seo", "spa", "ssr", "server"]
categories = ["web-programming::http-server"]
publish = false

[lib]
name = "vite_serve"
path = "src/lib.rs"

[[bin]]
name = "vite-serve"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:tracing-subscriber"]
embed = ["dep:rust-embed"]

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"], optional = true }
lol_html = "3"
matchit = "0.9"
mime_guess = "2"
percent-encoding = "2"
rust-embed = { version = "8", optional = true, features = ["interpolate-folder-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "fs"] }
tower-http = { version = "0.7", features = ["compression-gzip", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
ureq = { version = "3", default-features = false }
